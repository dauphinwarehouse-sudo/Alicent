name: Check and package Windows prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  announce:
    name: Publish pending commit status
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, context: 'alicent/ci', state: 'pending',
              description: 'Windows checks and packaging are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  core:
    name: Rust core / Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  frontend:
    name: Frontend / Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: test-results/
  windows-prototype:
    name: Unsigned Windows x64 prototype and installed-native audit
    needs: [core, frontend]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo check --locked -p alicent-desktop
      - run: npm run tauri -w @alicent/desktop -- build -- --locked
      - name: Test installed application through WebView2
        shell: powershell
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          ./scripts/native-windows-e2e.ps1 -InstallerPath $installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-e2e-results
          path: test-results/native-windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: alicent-windows-x64-unsigned-prototype
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - run: cargo metadata --locked --format-version 1 > cargo-metadata.json
      - run: npm sbom --sbom-format cyclonedx > npm-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: |
            cargo-metadata.json
            npm-sbom.cdx.json

  report:
    name: Publish CI result and PR report
    if: ${{ always() }}
    needs: [announce, core, frontend, windows-prototype]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      actions: read
      checks: read
      pull-requests: write
    steps:
      # This job runs with write permissions, so the reporting script is taken
      # from the base branch instead of from the pull request head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const { report } = require('./scripts/report-ci.cjs');
            await report({ github, context, core, results: JSON.parse(process.env.JOB_RESULTS) });
