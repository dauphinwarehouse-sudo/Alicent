name: Diagnose durable queue branch
on:
  workflow_dispatch:
  push:
    branches: [feat/durable-agent-queue]
    paths: [.github/workflows/diagnose-durable-queue.yml]
permissions:
  contents: write
  pull-requests: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/durable-agent-queue
      - id: toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - id: node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: validate
        name: Repair, format, and validate
        shell: bash
        run: |
          set +e
          : > /tmp/diagnostics.txt
          sed -i 's/^use super::super::\*;/use super::*;/' crates/project-repository/src/agent_queue.rs
          cargo fmt --all >> /tmp/diagnostics.txt 2>&1
          format_status=$?
          cargo fmt --all --check >> /tmp/diagnostics.txt 2>&1
          format_check_status=$?
          cargo clippy --locked --all-targets -- -D warnings >> /tmp/diagnostics.txt 2>&1
          clippy_status=$?
          cargo test --locked >> /tmp/diagnostics.txt 2>&1
          test_status=$?
          npm ci >> /tmp/diagnostics.txt 2>&1
          npm_status=$?
          if [ "$npm_status" -eq 0 ]; then npm run check >> /tmp/diagnostics.txt 2>&1; check_status=$?; else check_status=1; fi
          if [ "$format_status" -ne 0 ] || [ "$format_check_status" -ne 0 ] || [ "$clippy_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$check_status" -ne 0 ]; then failed=1; else failed=0; fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          tail -c 30000 /tmp/diagnostics.txt > .ci-durable-diagnostics.txt
      - name: Publish diagnostic comment
        if: always()
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.validate.outputs.failed }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          NODE: ${{ steps.node.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- manual-ci-diagnostic:20 -->';
            const text = fs.existsSync('.ci-durable-diagnostics.txt') ? fs.readFileSync('.ci-durable-diagnostics.txt', 'utf8') : 'diagnostics unavailable';
            const result = process.env.FAILED === '0' ? 'success' : 'failure';
            const body = `${marker}\n## Durable queue diagnostic\nResult: **${result}**\nToolchain: ${process.env.TOOLCHAIN}; Node: ${process.env.NODE}\n\n\`\`\`text\n${text.slice(-28000)}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: 20, per_page: 100});
            const old = comments.find(comment => comment.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({...context.repo, comment_id: old.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: 20, body});
      - name: Publish branch state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.validate.outputs.failed }}" = 0 ]; then
            git rm .github/workflows/diagnose-durable-queue.yml
            rm -f .ci-durable-diagnostics.txt
            message='fix: validate durable queue branch'
          else
            message='ci: publish durable queue diagnostics'
          fi
          git add -A
          git commit -m "$message"
          git push origin HEAD:feat/durable-agent-queue
      - name: Fail when validation failed
        if: steps.validate.outputs.failed != '0'
        run: exit 1
