name: Temporary provider lock refresh
on:
  push:
    branches: [feat/provider-production-integration]
    paths:
      - .github/workflows/provider-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - run: cargo metadata --format-version 1 > /dev/null
      - shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore: refresh provider integration lockfile"
          git push
