name: One-shot repair and rustfmt
on:
  push:
    branches: [feat/order-keys-idempotent-create]
permissions:
  contents: write
concurrency:
  group: order-keys-repair-once
  cancel-in-progress: true
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/order-keys-idempotent-create
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - name: Update v4 migration expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/project-repository/tests/recovery.rs')
          s = p.read_text()
          s = s.replace('assert_eq!(backup.schema_version, 3);', 'assert_eq!(backup.schema_version, 4);')
          s = s.replace('assert_eq!(repo.project().unwrap().schema_version, 3);', 'assert_eq!(repo.project().unwrap().schema_version, 4);')
          s = s.replace('assert_eq!(backups.len(), 2);\n    let old_path', 'assert_eq!(backups.len(), 3);\n    let old_path')
          s = s.replace('assert_eq!(std::fs::read_dir(root.join("backups")).unwrap().count(), 2);', 'assert_eq!(std::fs::read_dir(root.join("backups")).unwrap().count(), 3);')
          old = '''    assert_eq!(backups.len(), 1);
    assert!(backups[0]
        .file_name()
        .to_string_lossy()
        .starts_with("pre-migration-v2-"));
    let old = Connection::open(backups[0].path()).unwrap();'''
          new = '''    assert_eq!(backups.len(), 2);
    let v2_backup = backups
        .iter()
        .find(|entry| {
            entry
                .file_name()
                .to_string_lossy()
                .starts_with("pre-migration-v2-")
        })
        .unwrap();
    let old = Connection::open(v2_backup.path()).unwrap();'''
          if old not in s:
              raise SystemExit('v2 migration assertion block not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('packages/contracts/src/index.ts')
          s = p.read_text()
          s = s.replace('/** Version 4 recovery, ordering and runtime contracts. */', '/** Version 2 recovery IPC and future runtime contracts. No provider requests are implemented here. */')
          s = s.replace('  secretRef: string;\n', '  secretRef: string; // Opaque OS-vault reference, NEVER a key.\n')
          s = s.replace('  | { type: "reasoning_summary"; text: string }\n', '  | { type: "reasoning_summary"; text: string } // Only content explicitly supplied by provider.\n')
          s = s.replace('  | { type: "tool_call"; call: ToolCall }\n', '  | { type: "tool_call"; call: ToolCall } // Emit only after complete argument parsing/validation.\n')
          s = s.replace('export function needsApproval(', '/** Design-time fail-closed policy. Runtime must bind approval to exact command + payload hash. */\nexport function needsApproval(')
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/project-repository/tests/recovery.rs apps/desktop/src-tauri/src/main.rs packages/contracts/src/index.ts
          git commit -m 'test: update v4 migration coverage'
          git push
