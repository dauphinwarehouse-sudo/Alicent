name: Repair durable queue branch
on:
  push:
    branches: [feat/durable-agent-queue]
    paths: [.github/workflows/fix-durable-agent-queue.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/durable-agent-queue
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Restore the additive diff
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- crates/project-repository/src/lib.rs crates/project-repository/src/checkpoints.rs apps/desktop/src-tauri/src/main.rs
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('crates/project-repository/src/lib.rs')
          text = lib.read_text()
          marker = 'mod checkpoints;\nmod recovery;'
          replacement = 'mod agent_queue;\nmod checkpoints;\nmod recovery;'
          if replacement not in text:
              if marker not in text:
                  raise SystemExit('project repository module marker not found')
              lib.write_text(text.replace(marker, replacement, 1))
          queue = Path('crates/project-repository/src/agent_queue.rs')
          text = queue.read_text()
          if text.startswith('use super::super::*;'):
              text = text.replace('use super::super::*;', 'use super::*;', 1)
          if not text.startswith('use super::*;'):
              raise SystemExit('queue module import marker not found')
          queue.write_text(text)
          PY
          cargo fmt --all
      - name: Validate Rust core
        shell: bash
        run: |
          set +e
          : > /tmp/durable-queue-diagnostics.txt
          cargo fmt --all --check >> /tmp/durable-queue-diagnostics.txt 2>&1
          fmt_status=$?
          cargo clippy --locked --all-targets -- -D warnings >> /tmp/durable-queue-diagnostics.txt 2>&1
          clippy_status=$?
          cargo test --locked >> /tmp/durable-queue-diagnostics.txt 2>&1
          test_status=$?
          if [ "$fmt_status" -ne 0 ] || [ "$clippy_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            cp /tmp/durable-queue-diagnostics.txt .ci-diagnostics.txt
            echo 'VALIDATION_FAILED=1' >> "$GITHUB_ENV"
          else
            rm -f .ci-diagnostics.txt
            echo 'VALIDATION_FAILED=0' >> "$GITHUB_ENV"
          fi
      - name: Publish repaired branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$VALIDATION_FAILED" = 0 ]; then
            git rm .github/workflows/fix-durable-agent-queue.yml
            message='fix: validate durable queue core'
          else
            message='ci: publish durable queue diagnostics'
          fi
          git add -A
          git commit -m "$message"
          git push origin HEAD:feat/durable-agent-queue
      - name: Fail when diagnostics were published
        if: env.VALIDATION_FAILED == '1'
        run: exit 1
