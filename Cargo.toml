[workspace]
members = [
  "crates/domain",
  "crates/project-repository",
  "crates/provider-wire",
  "crates/document-io",
  "crates/tool-runtime",
  "crates/story-graph",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/domain",
  "crates/project-repository",
  "crates/provider-wire",
  "crates/document-io",
  "crates/tool-runtime",
  "crates/story-graph",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
